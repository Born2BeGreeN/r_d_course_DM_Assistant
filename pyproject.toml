[project]
name = "adventure-assistant"
version = "0.1.0"
description = "Structured extraction from tabletop RPG adventure texts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "pypdf",
    "google-genai",
    "httpx",
    "python-dotenv",
    "openai>=3.42.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
